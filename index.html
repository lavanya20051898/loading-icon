<!DOCTYPE html>
<html>
<head>
    <title>Fetch Real Advice</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        button { padding: 10px 20px; cursor: pointer; }
        #result { margin-top: 20px; max-width: 600px; margin-left:auto; margin-right:auto; text-align:left; }
    </style>
</head>
<body>

    <h2>Get Real Advice with Loading Icon with API Call</h2>
    <button onclick="fetchAdvice()">Get Advice</button>

    <div class="loader" id="loader"></div>
    <div id="result"></div>

    <script>
        async function fetchAdvice() {
            const loader = document.getElementById("loader");
            const result = document.getElementById("result");

            loader.style.display = "block"; // show spinner
            result.innerHTML = "";

            try {
                const response = await fetch("https://api.adviceslip.com/advice");
                const data = await response.json();

                loader.style.display = "none"; // hide spinner

                result.innerHTML = `<h3>Advice #${data.slip.id}</h3><p>${data.slip.advice}</p>`;
            } catch (error) {
                loader.style.display = "none";
                result.innerHTML = `<p style="color:red;">Error fetching data: ${error.message}</p>`;
            }
        }
    </script>

</body>
</html>
